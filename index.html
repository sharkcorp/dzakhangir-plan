<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JAHONGIR OS</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#060816;--card:rgba(10,14,30,0.97);--border:rgba(255,255,255,0.07);
  --blue:#4fc3f7;--blue2:#1a5fff;--purple:#b45cff;--purple2:#6b21a8;
  --cyan:#00d4ff;--green:#00e5a0;--yellow:#fbbf24;--red:#ff4d6d;
  --text:#f0f4ff;--t2:rgba(240,244,255,0.55);--t3:rgba(240,244,255,0.28);
  --r:22px;--rs:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{background:var(--bg);}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',system-ui,sans-serif;
  font-size:14px;min-height:100vh;
  padding-bottom:calc(100px + env(safe-area-inset-bottom));
  overflow-x:hidden;position:relative;
}
body::before{
  content:'';position:fixed;top:-120px;right:-80px;width:520px;height:520px;
  background:radial-gradient(circle,rgba(79,195,247,0.05) 0%,transparent 65%);
  pointer-events:none;z-index:0;
}
body::after{
  content:'';position:fixed;bottom:80px;left:-130px;width:440px;height:440px;
  background:radial-gradient(circle,rgba(180,92,255,0.05) 0%,transparent 65%);
  pointer-events:none;z-index:0;
}
.screen{display:none;position:relative;z-index:1;}
.screen.active{display:block;animation:fi .25s ease;}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ── TOP BAR ── */
.topbar{display:flex;align-items:center;gap:14px;padding:20px 20px 12px;}
.ava-ring{
  width:52px;height:52px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,var(--blue),var(--purple));
  padding:2px;
  box-shadow:0 0 22px rgba(79,195,247,0.38),0 0 44px rgba(79,195,247,0.1);
}
.ava{
  width:100%;height:100%;border-radius:50%;
  background:#0a0e1e;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:700;overflow:hidden;
}
.ava img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.tb-info{flex:1;}
.tb-name{font-size:16px;font-weight:700;letter-spacing:-.3px;}
.tb-sub{font-size:11px;color:var(--t3);margin-top:2px;}
.bell{
  width:40px;height:40px;border-radius:50%;flex-shrink:0;
  background:rgba(255,255,255,0.04);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-size:17px;
  position:relative;
}
.bell-dot{
  position:absolute;top:8px;right:9px;width:7px;height:7px;
  border-radius:50%;background:var(--red);border:1.5px solid var(--bg);
  box-shadow:0 0 6px rgba(255,77,109,.8);
}

/* ── HERO CARD ── */
.hero{
  margin:4px 16px 16px;
  background:linear-gradient(150deg,#0c1a42 0%,#07091c 42%,#0d0822 100%);
  border-radius:26px;padding:0;
  position:relative;overflow:hidden;
  box-shadow:
    0 0 0 1px rgba(79,195,247,.1),
    0 28px 70px rgba(0,0,0,.75),
    0 0 160px rgba(0,212,255,.04) inset;
  display:flex;flex-direction:column;min-height:160px;
}
/* Strong top-right cyan corona */
.hero::after{
  content:'';position:absolute;top:-100px;right:-70px;width:380px;height:380px;
  background:radial-gradient(circle,rgba(0,212,255,.18) 0%,rgba(79,195,247,.07) 38%,transparent 65%);
  pointer-events:none;
}
/* Bottom-left purple depth */
.hero-purple{
  position:absolute;bottom:-80px;left:-50px;width:300px;height:300px;
  background:radial-gradient(circle,rgba(107,33,168,.15) 0%,transparent 65%);
  pointer-events:none;
}
/* Bloom light behind ring */
.ring-bloom{
  position:absolute;right:20px;top:20px;
  width:160px;height:160px;
  background:radial-gradient(circle,rgba(74,158,255,.2) 0%,rgba(74,158,255,.05) 45%,transparent 70%);
  pointer-events:none;filter:blur(16px);
}
/* Star particles */
.hero-dots{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;overflow:hidden;border-radius:26px;}
.hero-dots::before{
  content:'';position:absolute;width:2px;height:2px;border-radius:50%;
  background:rgba(79,195,247,.6);top:24px;left:24px;
  box-shadow:
    48px 12px 0 rgba(74,158,255,.4),72px 8px 0 rgba(79,195,247,.3),
    24px 64px 0 rgba(74,158,255,.2);
}
.hero-dots::after{
  content:'';position:absolute;width:1px;height:1px;border-radius:50%;
  background:rgba(255,255,255,.5);top:56px;left:48px;
  box-shadow:
    120px 16px 0 rgba(255,255,255,.35),80px 48px 0 rgba(255,255,255,.25);
}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;position:relative;z-index:1;padding:20px;flex:1;}
.hero-left{flex:1;}
.sp-eyebrow{font-size:11px;font-weight:700;letter-spacing:.5px;color:#fff;text-transform:uppercase;margin-bottom:4px;}
.sp-num{font-size:28px;font-weight:800;line-height:1;letter-spacing:-.3px;color:#fff;margin-bottom:4px;}
.sp-dates{font-size:14px;color:rgba(240,244,255,.55);margin-bottom:12px;}

/* Goals list in left column */
.mission-goals{display:flex;flex-direction:column;gap:8px;position:relative;z-index:1;}
.mission-goal{display:flex;align-items:center;gap:8px;font-size:12px;color:rgba(240,244,255,.7);}
.mission-goal input[type="checkbox"]{
  width:18px;height:18px;cursor:pointer;accent-color:#4A9EFF;flex-shrink:0;
  appearance:none;-webkit-appearance:none;background:rgba(74,158,255,.15);
  border:1.5px solid rgba(74,158,255,.5);border-radius:4px;
  display:flex;align-items:center;justify-content:center;transition:all 200ms ease;
}
.mission-goal input[type="checkbox"]:checked{
  background:#4A9EFF;border-color:#4A9EFF;
}
.mission-goal input[type="checkbox"]:checked::after{
  content:'✓';color:#fff;font-size:11px;font-weight:700;
}
.mission-goal label{cursor:pointer;flex:1;user-select:none;}

/* Ring 90px r=36 circ≈226 */
.ring-wrap{width:90px;height:90px;position:relative;flex-shrink:0;}
.ring-svg{width:90px;height:90px;transform:rotate(-90deg);}
.ring-bg{fill:none;stroke:rgba(255,255,255,.08);stroke-width:8;}
.ring-fg{
  fill:none;stroke:#4A9EFF;stroke-width:8;stroke-linecap:round;
  stroke-dasharray:226;stroke-dashoffset:226;
  transition:stroke-dashoffset 1.4s cubic-bezier(.4,0,.2,1);
  animation:ring-glow-bright 2.8s ease-in-out infinite;
}
@keyframes ring-glow-bright{
  0%,100%{
    filter:
      drop-shadow(0 0 5px #4A9EFF)
      drop-shadow(0 0 12px rgba(74,158,255,.7))
      drop-shadow(0 0 24px rgba(74,158,255,.3));
  }
  50%{
    filter:
      drop-shadow(0 0 8px #4A9EFF)
      drop-shadow(0 0 18px rgba(74,158,255,.9))
      drop-shadow(0 0 36px rgba(74,158,255,.4));
  }
}
.ring-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;}
.ring-pct{font-size:28px;font-weight:700;color:#fff;line-height:1;}

.sp-progress{
  margin-top:auto;position:relative;z-index:1;
  border-top:1px solid rgba(255,255,255,.08);
  padding:12px 20px;
  display:flex;flex-direction:column;align-items:center;gap:6px;
}
.sp-progress-track{height:2px;background:rgba(74,158,255,.3);border-radius:4px;overflow:hidden;width:100%;}
.sp-progress-fill{
  height:100%;border-radius:4px;
  background:linear-gradient(90deg,#1a5fff,#4A9EFF);
  box-shadow:0 0 8px rgba(74,158,255,.6);
  transition:width 1.4s cubic-bezier(.4,0,.2,1);width:0%;
}
.sp-progress-meta{font-size:12px;color:rgba(240,244,255,.55);text-align:center;}

/* ── METRIC GRID ── */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px;padding:0 16px 16px;}
/* No generic .mc border — each card has its own color identity */
.mc{border-radius:22px;padding:18px 16px 14px;position:relative;overflow:hidden;}
.mc-bl{
  background:linear-gradient(155deg,rgba(26,95,255,.14) 0%,rgba(7,10,22,.99) 68%);
  box-shadow:0 0 0 1px rgba(79,195,247,.12),0 16px 44px rgba(0,0,0,.6),0 0 50px rgba(79,195,247,.05) inset;
}
.mc-gr{
  background:linear-gradient(155deg,rgba(0,180,130,.11) 0%,rgba(7,10,22,.99) 68%);
  box-shadow:0 0 0 1px rgba(0,229,160,.1),0 16px 44px rgba(0,0,0,.6),0 0 50px rgba(0,229,160,.04) inset;
}
.mc-yl{
  background:linear-gradient(155deg,rgba(220,150,0,.1) 0%,rgba(7,10,22,.99) 68%);
  box-shadow:0 0 0 1px rgba(251,191,36,.1),0 16px 44px rgba(0,0,0,.6),0 0 50px rgba(251,191,36,.04) inset;
}
.mc-pu{
  background:linear-gradient(155deg,rgba(150,50,220,.12) 0%,rgba(7,10,22,.99) 68%);
  box-shadow:0 0 0 1px rgba(180,92,255,.12),0 16px 44px rgba(0,0,0,.6),0 0 50px rgba(180,92,255,.05) inset;
}
/* Top light streak — subtle highlight */
.mc::before{
  content:'';position:absolute;top:0;left:12%;right:12%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);
}
/* Floating icon — no box, pure glow */
.mc-ico{width:32px;height:32px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;}
.mc-ico svg{width:16px;height:16px;}
.mc-bl .mc-ico{filter:drop-shadow(0 0 7px rgba(79,195,247,.9)) drop-shadow(0 0 18px rgba(79,195,247,.4));}
.mc-gr .mc-ico{filter:drop-shadow(0 0 7px rgba(0,229,160,.9)) drop-shadow(0 0 18px rgba(0,229,160,.4));}
.mc-yl .mc-ico{filter:drop-shadow(0 0 7px rgba(251,191,36,.9)) drop-shadow(0 0 18px rgba(251,191,36,.4));}
.mc-pu .mc-ico{filter:drop-shadow(0 0 7px rgba(180,92,255,.9)) drop-shadow(0 0 18px rgba(180,92,255,.4));}
.mc-lbl{font-size:11px;font-weight:600;letter-spacing:.8px;color:rgba(240,244,255,.6);text-transform:uppercase;margin-bottom:8px;}
.mc-val{font-size:36px;font-weight:900;line-height:1;letter-spacing:-.5px;margin-bottom:4px;color:#fff;}
.mc-sub{font-size:12px;color:rgba(240,244,255,.5);margin-bottom:10px;}
/* Ultra-thin bar — more air, less boxing */
.mc-bar{height:3px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden;margin:8px 0;}
.mc-fill{height:100%;border-radius:4px;transition:width .8s cubic-bezier(.4,0,.2,1);}
.mc-bl .mc-fill{background:linear-gradient(90deg,#2878FF,#4FA7FF);box-shadow:0 0 8px rgba(79,195,247,.6);}
.mc-gr .mc-fill{background:linear-gradient(90deg,#00b386,#00E5A0);box-shadow:0 0 8px rgba(0,229,160,.6);}
.mc-yl .mc-fill{background:linear-gradient(90deg,#d97706,#FDD039);box-shadow:0 0 8px rgba(251,191,36,.6);}
.mc-pu .mc-fill{background:linear-gradient(90deg,#9d4edd,#B45CFF);box-shadow:0 0 8px rgba(180,92,255,.6);}
.mc-pct{font-size:12px;font-weight:600;color:var(--t2);text-align:right;margin-top:4px;}
.mc-bl .mc-pct{color:#4FA7FF;}
.mc-gr .mc-pct{color:#00E5A0;}
.mc-yl .mc-pct{color:#FDD039;}
.mc-pu .mc-pct{color:#B45CFF;}
.mc-ring-row{display:flex;align-items:flex-end;justify-content:space-between;margin-top:4px;}

/* ── AI BAR ── */
.ai-bar{
  margin:0 16px 16px;
  background:linear-gradient(135deg,rgba(26,95,255,.1) 0%,rgba(180,92,255,.06) 100%);
  border:1px solid rgba(79,195,247,.18);border-radius:20px;
  padding:14px 16px;display:flex;align-items:center;gap:12px;
  position:relative;overflow:hidden;
}
.ai-bar::after{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(79,195,247,.25),transparent);
}
.ai-left{flex:1;}
.ai-tag{font-size:8px;font-weight:700;letter-spacing:2px;color:var(--blue);text-transform:uppercase;margin-bottom:4px;}
.ai-txt{font-size:13px;color:var(--t2);line-height:1.4;}
.ai-txt strong{color:var(--text);}
.ai-bot{
  width:48px;height:48px;border-radius:16px;flex-shrink:0;
  background:linear-gradient(145deg,rgba(26,95,255,.28),rgba(107,33,168,.28));
  border:1px solid rgba(79,195,247,.2);
  display:flex;align-items:center;justify-content:center;font-size:24px;
  box-shadow:0 0 20px rgba(79,195,247,.2),0 0 40px rgba(79,195,247,.05);
}

/* ── SECTIONS ── */
.sec-hdr{padding:16px 20px 10px;font-size:9px;font-weight:700;letter-spacing:1.8px;color:var(--t3);text-transform:uppercase;}

/* ── INPUTS ── */
.inp-rows{padding:0 16px 14px;display:flex;flex-direction:column;gap:8px;}
.inp-row{
  display:flex;align-items:center;gap:12px;
  background:rgba(10,14,30,.8);border:1px solid var(--border);
  border-radius:16px;padding:13px 14px;
  box-shadow:0 4px 16px rgba(0,0,0,.3);
}
.inp-em{font-size:17px;flex-shrink:0;}
.inp-lbl{flex:1;font-size:13px;color:var(--t2);}
.inp-field{
  width:78px;background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.1);
  border-radius:11px;padding:7px 10px;
  color:var(--text);font-size:15px;font-weight:700;text-align:right;outline:none;
  transition:border-color .2s,box-shadow .2s;
}
.inp-field:focus{border-color:rgba(79,195,247,.4);box-shadow:0 0 0 3px rgba(79,195,247,.08);}
.save-btn{
  display:block;width:calc(100% - 32px);margin:0 16px 16px;padding:15px;
  background:linear-gradient(135deg,var(--blue2) 0%,var(--purple2) 100%);
  border:none;border-radius:18px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;
  box-shadow:0 4px 24px rgba(26,95,255,.4),0 0 0 1px rgba(79,195,247,.2),inset 0 1px 0 rgba(255,255,255,.15);
  transition:opacity .15s,transform .15s;
}
.save-btn:active{opacity:.85;transform:scale(.99);}

/* ── GOALS ── */
.goal-row{
  margin:0 16px 8px;
  background:linear-gradient(155deg,rgba(12,17,36,.97),rgba(7,10,22,.99));
  border:1px solid var(--border);border-radius:16px;padding:14px;
  display:flex;align-items:center;gap:12px;
  box-shadow:0 4px 20px rgba(0,0,0,.3);
}
.gi{font-size:22px;flex-shrink:0;}
.g-info{flex:1;}
.g-name{font-size:13px;font-weight:700;}
.g-desc{font-size:10px;color:var(--t3);margin:2px 0 8px;}
.g-bar{height:3px;background:rgba(255,255,255,.06);border-radius:6px;overflow:hidden;}
.g-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--blue2),var(--blue));}
.g-pct{font-size:16px;font-weight:800;color:var(--blue);flex-shrink:0;}

/* ── RULES ── */
.rule-row{
  margin:0 16px 8px;background:rgba(10,14,30,.7);
  border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:13px 14px;display:flex;gap:12px;
}
.rn{
  width:22px;height:22px;border-radius:50%;flex-shrink:0;
  background:rgba(79,195,247,.1);color:var(--blue);
  font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;
}
.rt{font-size:12px;color:var(--t2);line-height:1.5;}

/* ── SCREEN HEADER ── */
.shdr{padding:22px 20px 14px;display:flex;align-items:center;}
.shdr-t{font-size:24px;font-weight:800;letter-spacing:-.5px;}

/* ── CHECKLIST ── */
.sp-div{margin:20px 16px 10px;display:flex;align-items:center;gap:10px;}
.sp-div-t{font-size:8px;font-weight:700;letter-spacing:2px;color:var(--t3);white-space:nowrap;text-transform:uppercase;}
.sp-div-l{flex:1;height:1px;background:rgba(255,255,255,.05);}
.day-card{margin:0 16px 8px;background:rgba(10,14,30,.85);border:1px solid var(--border);border-radius:18px;padding:14px;}
.day-card.today{
  background:linear-gradient(145deg,rgba(26,95,255,.12),rgba(107,33,168,.06));
  border-color:rgba(79,195,247,.25);box-shadow:0 0 24px rgba(79,195,247,.06);
}
.day-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.day-lbl{font-size:13px;font-weight:700;}
.day-dt{font-size:10px;color:var(--t3);margin-top:2px;}
.dchip{font-size:8px;font-weight:700;padding:3px 9px;border-radius:8px;letter-spacing:.5px;text-transform:uppercase;}
.dchip.work{background:rgba(79,195,247,.12);color:var(--blue);}
.dchip.ozon{background:rgba(251,191,36,.12);color:var(--yellow);}
.dchip.rest{background:rgba(0,229,160,.1);color:var(--green);}
.checks{display:flex;gap:6px;}
.chk{
  flex:1;display:flex;align-items:center;gap:7px;
  background:rgba(255,255,255,.03);border:1px solid var(--border);
  border-radius:12px;padding:8px 10px;cursor:pointer;transition:all .15s;
}
.chk.done{background:rgba(0,229,160,.08);border-color:rgba(0,229,160,.2);}
.chk-dot{width:17px;height:17px;border-radius:50%;border:1.5px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:9px;flex-shrink:0;}
.chk.done .chk-dot{background:var(--green);border-color:var(--green);color:#000;}
.chk-l{font-size:10px;font-weight:600;color:var(--t2);}
.chk.done .chk-l{color:var(--green);}
.ozon-msg{font-size:11px;color:var(--t3);padding:2px 0;}

/* ── SCHEDULE ── */
.stabs{display:flex;gap:7px;padding:0 16px 14px;overflow-x:auto;scrollbar-width:none;}
.stab{padding:8px 16px;border-radius:20px;font-size:12px;font-weight:600;border:1px solid rgba(255,255,255,.08);background:transparent;color:var(--t3);cursor:pointer;white-space:nowrap;flex-shrink:0;}
.stab.active{background:rgba(26,95,255,.2);border-color:rgba(79,195,247,.3);color:var(--blue);}
.spanel{display:none;padding:0 16px;}
.spanel.active{display:block;}
.scard{background:rgba(10,14,30,.85);border:1px solid var(--border);border-radius:18px;overflow:hidden;margin-bottom:12px;}
.scard-hdr{padding:12px 16px;font-size:11px;font-weight:700;color:var(--t2);border-bottom:1px solid rgba(255,255,255,.05);}
.trow{display:flex;gap:14px;padding:11px 16px;border-bottom:1px solid rgba(255,255,255,.03);}
.trow:last-child{border-bottom:none;}
.tchip{font-size:10px;font-weight:700;color:var(--blue);white-space:nowrap;min-width:88px;padding-top:1px;}
.ttxt{font-size:12px;color:var(--t2);line-height:1.4;}
.wcard{padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.03);}
.wcard:last-child{border-bottom:none;}
.wday{font-size:12px;font-weight:700;margin-bottom:2px;}
.wtype{font-size:9px;font-weight:700;color:var(--blue);letter-spacing:1px;margin-bottom:4px;text-transform:uppercase;}
.wdesc{font-size:11px;color:var(--t3);line-height:1.4;}
.srow{display:flex;gap:14px;padding:11px 16px;border-bottom:1px solid rgba(255,255,255,.03);align-items:flex-start;}
.srow:last-child{border-bottom:none;}
.speriod{font-size:11px;font-weight:700;color:var(--purple);min-width:70px;}
.srule{font-size:11px;color:var(--t3);line-height:1.4;}
.warn-c{background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.15);border-radius:16px;padding:12px 14px;margin-bottom:12px;font-size:12px;color:var(--t2);}
.warn-c strong{color:var(--yellow);display:block;margin-bottom:3px;}

/* ── CONTENT ── */
.pipeline{display:flex;align-items:center;gap:4px;padding:0 16px 16px;overflow-x:auto;scrollbar-width:none;}
.ps{display:flex;flex-direction:column;align-items:center;gap:5px;flex-shrink:0;min-width:54px;}
.pc{width:46px;height:46px;border-radius:50%;background:rgba(10,14,30,.9);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:18px;position:relative;}
.pb{position:absolute;top:-4px;right:-4px;background:var(--blue);color:#fff;font-size:9px;font-weight:700;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg);}
.pb.g{background:var(--green);color:#000;}
.pb.p{background:var(--purple);}
.pb.y{background:var(--yellow);color:#000;}
.pl{font-size:9px;font-weight:700;color:var(--t3);text-align:center;}
.parr{font-size:11px;color:var(--t3);flex-shrink:0;padding-bottom:18px;}
.whdr{margin:12px 16px 8px;font-size:9px;font-weight:700;letter-spacing:1.8px;color:var(--t3);text-transform:uppercase;display:flex;align-items:center;gap:8px;}
.whdr::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.05);}
.post-c{margin:0 16px 8px;background:rgba(10,14,30,.85);border:1px solid var(--border);border-radius:16px;padding:14px;}
.post-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:7px;}
.post-t{font-size:13px;font-weight:600;flex:1;line-height:1.35;}
.schip{font-size:8px;font-weight:700;padding:3px 9px;border-radius:8px;white-space:nowrap;flex-shrink:0;cursor:pointer;text-transform:uppercase;letter-spacing:.5px;}
.si{background:rgba(251,191,36,.15);color:var(--yellow);}
.sr{background:rgba(79,195,247,.12);color:var(--blue);}
.sd{background:rgba(0,229,160,.1);color:var(--green);}
.post-meta{display:flex;gap:7px;}
.pfmt{font-size:10px;color:var(--t3);background:rgba(255,255,255,.04);padding:2px 8px;border-radius:6px;}
.pdate{font-size:10px;color:var(--t3);}

/* ── FLOATING NAV DOCK ── */
.nav{
  position:fixed;bottom:12px;left:12px;right:12px;height:68px;
  border-radius:28px;
  background:rgba(7,10,22,.9);
  backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);
  border:1px solid rgba(255,255,255,.08);
  box-shadow:
    0 0 0 .5px rgba(255,255,255,.04) inset,
    0 -1px 0 rgba(255,255,255,.05) inset,
    0 8px 40px rgba(0,0,0,.75),
    0 24px 60px rgba(0,0,0,.4);
  display:flex;align-items:center;
  padding:0 16px calc(0px + env(safe-area-inset-bottom));
  z-index:100;
}
.nb{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:8px 4px;border:none;background:none;
  color:var(--t3);font-size:9px;font-weight:600;letter-spacing:.3px;
  border-radius:16px;cursor:pointer;transition:all .2s;text-transform:uppercase;
}
.nb.active{color:var(--blue);background:rgba(79,195,247,.08);}
.nb.active svg{filter:drop-shadow(0 0 6px rgba(79,195,247,.8));}
.nb svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;}
.nav-ai{
  width:64px;height:64px;border-radius:50%;
  background:linear-gradient(145deg,#1060ff 0%,#5a18b0 55%,#1a2080 100%);
  border:none;cursor:pointer;flex-shrink:0;margin:0 4px;margin-top:-10px;
  display:flex;align-items:center;justify-content:center;
  position:relative;
  animation:orb-pulse 2.6s ease-in-out infinite;
}
/* Outer ring aura */
.nav-ai::before{
  content:'';position:absolute;inset:-7px;border-radius:50%;
  border:1.5px solid rgba(79,195,247,.28);
  animation:ai-ring 2.4s ease-in-out infinite;
}
/* Inner glass reflection */
.nav-ai::after{
  content:'';position:absolute;
  top:6px;left:8px;width:22px;height:10px;
  background:linear-gradient(180deg,rgba(255,255,255,.22),transparent);
  border-radius:50%;filter:blur(3px);
}
@keyframes ai-ring{
  0%,100%{transform:scale(1);opacity:.45;border-color:rgba(79,195,247,.22);}
  50%{transform:scale(1.1);opacity:1;border-color:rgba(79,195,247,.65);}
}
@keyframes orb-pulse{
  0%,100%{
    box-shadow:
      0 0 0 0 rgba(79,195,247,0),
      0 0 22px rgba(79,195,247,.55),
      0 0 55px rgba(79,195,247,.28),
      0 0 90px rgba(79,195,247,.1),
      inset 0 1px 0 rgba(255,255,255,.22);
  }
  50%{
    box-shadow:
      0 0 0 10px rgba(79,195,247,.04),
      0 0 34px rgba(79,195,247,.78),
      0 0 80px rgba(79,195,247,.42),
      0 0 120px rgba(79,195,247,.16),
      inset 0 1px 0 rgba(255,255,255,.22);
  }
}
.nav-ai svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:1.8;position:relative;z-index:1;filter:drop-shadow(0 0 5px rgba(255,255,255,.6));}

/* ── HABITS SCREEN ── */
.hb-hero{
  margin:4px 16px 16px;
  background:linear-gradient(150deg,#0e1424 0%,#07091c 48%,#0b0820 100%);
  border-radius:26px;padding:20px 18px 18px;
  position:relative;overflow:hidden;
  box-shadow:0 0 0 1px rgba(255,100,50,.1),0 24px 60px rgba(0,0,0,.7);
}
.hb-hero::after{
  content:'';position:absolute;top:-70px;right:-50px;width:240px;height:240px;
  background:radial-gradient(circle,rgba(255,130,40,.16) 0%,rgba(255,70,70,.05) 42%,transparent 70%);
  pointer-events:none;
}
.hb-hero-bloom{
  position:absolute;left:-30px;bottom:-60px;width:240px;height:240px;
  background:radial-gradient(circle,rgba(180,92,255,.12) 0%,transparent 65%);
  pointer-events:none;
}
.hb-hero-dots{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;overflow:hidden;border-radius:26px;}
.hb-hero-dots::before{
  content:'';position:absolute;width:2px;height:2px;border-radius:50%;
  background:rgba(255,130,40,.55);top:18px;left:24px;
  box-shadow:58px 8px 0 rgba(255,90,50,.28),28px 48px 0 rgba(180,92,255,.18),
    128px 12px 0 rgba(255,130,40,.28),92px 50px 0 rgba(180,92,255,.14),
    170px 22px 0 rgba(255,100,50,.2),8px 70px 0 rgba(180,92,255,.14);
}
.hb-hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;position:relative;z-index:1;}
.hb-hero-left{flex:1;padding-top:4px;}
.hb-eyebrow{font-size:9px;font-weight:700;letter-spacing:2px;color:rgba(255,140,60,.85);text-transform:uppercase;margin-bottom:10px;}
.hb-streak{font-size:26px;font-weight:900;line-height:1.1;margin-bottom:5px;}
.hb-streak-num{color:#ff8030;text-shadow:0 0 20px rgba(255,128,48,.55);}
.hb-consistency{font-size:12px;color:var(--t2);margin-bottom:4px;}
.hb-done-count{font-size:11px;color:var(--t3);}
/* Habit ring — 100px r=40 circ≈251 */
.hb-ring-wrap{width:100px;height:100px;position:relative;flex-shrink:0;}
.hb-ring-svg{width:100px;height:100px;transform:rotate(-90deg);}
.hb-ring-bg{fill:none;stroke:rgba(255,255,255,.05);stroke-width:9;}
.hb-ring-fg{
  fill:none;stroke:#ff8030;stroke-width:10;stroke-linecap:round;
  stroke-dasharray:251;stroke-dashoffset:251;
  transition:stroke-dashoffset 1.2s cubic-bezier(.4,0,.2,1);
  animation:hb-glow 2.8s ease-in-out infinite;
}
@keyframes hb-glow{
  0%,100%{filter:drop-shadow(0 0 5px #ff8030) drop-shadow(0 0 14px rgba(255,128,48,.75)) drop-shadow(0 0 28px rgba(255,128,48,.3));}
  50%{filter:drop-shadow(0 0 9px #ff8030) drop-shadow(0 0 22px rgba(255,128,48,1)) drop-shadow(0 0 44px rgba(255,128,48,.45));}
}
.hb-ring-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;}
.hb-ring-pct{font-size:20px;font-weight:900;color:#fff;line-height:1;letter-spacing:-.5px;}
.hb-ring-lbl{font-size:8px;color:var(--t3);letter-spacing:1px;text-transform:uppercase;margin-top:3px;}
/* Habit cards */
.hb-card{
  margin:0 16px 10px;border-radius:22px;padding:16px 16px 14px;
  position:relative;overflow:hidden;
}
.hb-card::before{
  content:'';position:absolute;top:0;left:10%;right:10%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent);
}
.hb-bl{background:linear-gradient(155deg,rgba(26,95,255,.14) 0%,rgba(7,10,22,.99) 70%);box-shadow:0 0 0 1px rgba(79,195,247,.12),0 14px 40px rgba(0,0,0,.6);}
.hb-pu{background:linear-gradient(155deg,rgba(150,50,220,.13) 0%,rgba(7,10,22,.99) 70%);box-shadow:0 0 0 1px rgba(180,92,255,.12),0 14px 40px rgba(0,0,0,.6);}
.hb-cy{background:linear-gradient(155deg,rgba(0,190,220,.1) 0%,rgba(7,10,22,.99) 70%);box-shadow:0 0 0 1px rgba(0,212,255,.1),0 14px 40px rgba(0,0,0,.6);}
.hb-yl{background:linear-gradient(155deg,rgba(220,150,0,.1) 0%,rgba(7,10,22,.99) 70%);box-shadow:0 0 0 1px rgba(251,191,36,.1),0 14px 40px rgba(0,0,0,.6);}
.hb-gr{background:linear-gradient(155deg,rgba(0,180,130,.11) 0%,rgba(7,10,22,.99) 70%);box-shadow:0 0 0 1px rgba(0,229,160,.1),0 14px 40px rgba(0,0,0,.6);}
/* Card header */
.hb-top{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.hb-ico{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.hb-bl .hb-ico{background:rgba(79,195,247,.12);}
.hb-pu .hb-ico{background:rgba(180,92,255,.12);}
.hb-cy .hb-ico{background:rgba(0,212,255,.1);}
.hb-yl .hb-ico{background:rgba(251,191,36,.1);}
.hb-gr .hb-ico{background:rgba(0,229,160,.1);}
.hb-info{flex:1;}
.hb-name{font-size:14px;font-weight:700;}
.hb-freq{font-size:10px;color:var(--t3);margin-top:2px;}
.hb-stk{font-size:12px;font-weight:800;display:flex;align-items:center;gap:2px;flex-shrink:0;}
.hb-bl .hb-stk{color:var(--blue);}
.hb-pu .hb-stk{color:var(--purple);}
.hb-cy .hb-stk{color:var(--cyan);}
.hb-yl .hb-stk{color:var(--yellow);}
.hb-gr .hb-stk{color:var(--green);}
/* 7-day week row */
.hb-week{display:flex;gap:3px;margin-bottom:12px;}
.hb-day{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;}
.hb-dot{
  width:28px;height:28px;border-radius:50%;
  background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.07);
  transition:all .25s;
}
.hb-dot.done{border-color:transparent;}
.hb-bl .hb-dot.done{background:linear-gradient(135deg,var(--blue2),var(--blue));box-shadow:0 0 10px rgba(79,195,247,.55);}
.hb-pu .hb-dot.done{background:linear-gradient(135deg,var(--purple2),var(--purple));box-shadow:0 0 10px rgba(180,92,255,.55);}
.hb-cy .hb-dot.done{background:linear-gradient(135deg,#006e90,var(--cyan));box-shadow:0 0 10px rgba(0,212,255,.55);}
.hb-yl .hb-dot.done{background:linear-gradient(135deg,#c05800,var(--yellow));box-shadow:0 0 10px rgba(251,191,36,.55);}
.hb-gr .hb-dot.done{background:linear-gradient(135deg,#009968,var(--green));box-shadow:0 0 10px rgba(0,229,160,.55);}
.hb-dot.today{border-color:rgba(255,255,255,.22);}
@keyframes dot-pulse{0%,100%{border-color:rgba(255,255,255,.18);}50%{border-color:rgba(255,255,255,.48);}}
.hb-dot.today:not(.done){animation:dot-pulse 2s ease-in-out infinite;}
.hb-dlbl{font-size:8px;color:var(--t3);font-weight:600;letter-spacing:.2px;}
.hb-dlbl.today{color:var(--blue);}
/* Today check button */
.hb-btn{
  width:100%;border:none;border-radius:14px;padding:11px;
  font-size:13px;font-weight:700;cursor:pointer;letter-spacing:.3px;
  transition:transform .1s,opacity .15s;
}
.hb-btn:active{transform:scale(.98);opacity:.8;}
.hb-btn.idle{background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.09);color:var(--t2);}
.hb-bl .hb-btn.done{background:rgba(79,195,247,.1);border:1.5px solid rgba(79,195,247,.28);color:var(--blue);}
.hb-pu .hb-btn.done{background:rgba(180,92,255,.1);border:1.5px solid rgba(180,92,255,.28);color:var(--purple);}
.hb-cy .hb-btn.done{background:rgba(0,212,255,.09);border:1.5px solid rgba(0,212,255,.28);color:var(--cyan);}
.hb-yl .hb-btn.done{background:rgba(251,191,36,.09);border:1.5px solid rgba(251,191,36,.28);color:var(--yellow);}
.hb-gr .hb-btn.done{background:rgba(0,229,160,.09);border:1.5px solid rgba(0,229,160,.28);color:var(--green);}
/* Add habit button */
.hb-add{
  display:block;width:calc(100% - 32px);margin:4px 16px 20px;
  padding:14px;border:1.5px solid rgba(79,195,247,.18);border-radius:18px;
  background:linear-gradient(135deg,rgba(26,95,255,.12),rgba(107,33,168,.12));
  color:var(--t2);font-size:14px;font-weight:700;cursor:pointer;letter-spacing:.3px;
  box-shadow:0 4px 20px rgba(26,95,255,.08);
  transition:transform .1s,opacity .15s;
}
.hb-add:active{transform:scale(.99);opacity:.8;}

/* ── FINANCE SCREEN ── */
.fn-hero{
  margin:4px 16px 14px;
  background:linear-gradient(150deg,#071a10 0%,#07091c 50%,#0a0820 100%);
  border-radius:26px;padding:22px 20px 18px;
  position:relative;overflow:hidden;
  box-shadow:0 0 0 1px rgba(0,229,160,.1),0 24px 60px rgba(0,0,0,.7);
}
.fn-hero::after{
  content:'';position:absolute;top:-70px;right:-50px;width:220px;height:220px;
  background:radial-gradient(circle,rgba(0,229,160,.14) 0%,transparent 65%);
  pointer-events:none;
}
.fn-bloom{
  position:absolute;left:-40px;bottom:-60px;width:240px;height:240px;
  background:radial-gradient(circle,rgba(26,95,255,.09) 0%,transparent 65%);
  pointer-events:none;
}
.fn-eyebrow{font-size:9px;font-weight:700;letter-spacing:2px;color:rgba(0,229,160,.8);text-transform:uppercase;margin-bottom:8px;position:relative;z-index:1;}
.fn-balance{font-size:38px;font-weight:900;line-height:1;letter-spacing:-1px;margin-bottom:14px;position:relative;z-index:1;}
.fn-balance.pos{color:var(--green);text-shadow:0 0 24px rgba(0,229,160,.3);}
.fn-balance.neg{color:var(--red);text-shadow:0 0 24px rgba(255,77,109,.3);}
.fn-balance.zero{color:var(--text);}
.fn-row2{display:flex;gap:10px;position:relative;z-index:1;}
.fn-c2{flex:1;background:rgba(255,255,255,.04);border-radius:14px;padding:10px 12px;}
.fn-c2-lbl{font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:5px;}
.fn-c2-lbl.inc{color:var(--green);}
.fn-c2-lbl.exp{color:var(--red);}
.fn-c2-val{font-size:17px;font-weight:800;}
.fn-c2-val.inc{color:var(--green);}
.fn-c2-val.exp{color:var(--red);}
/* Debt card */
.fn-debt-card{
  margin:0 16px 14px;
  background:linear-gradient(155deg,rgba(255,77,109,.08) 0%,rgba(7,10,22,.99) 65%);
  box-shadow:0 0 0 1px rgba(255,77,109,.12),0 14px 40px rgba(0,0,0,.5);
  border-radius:20px;padding:16px;
}
.fn-debt-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;gap:10px;}
.fn-debt-label{font-size:12px;font-weight:700;color:var(--t2);}
.fn-debt-sub{font-size:10px;color:var(--t3);margin-top:2px;}
.fn-debt-remain{font-size:18px;font-weight:900;color:var(--red);flex-shrink:0;text-align:right;}
.fn-debt-bar{height:3px;background:rgba(255,255,255,.06);border-radius:6px;overflow:hidden;margin-bottom:6px;}
.fn-debt-fill{height:100%;background:linear-gradient(90deg,#ff4d6d,#ff8096);border-radius:6px;box-shadow:0 0 8px rgba(255,77,109,.5);transition:width .8s cubic-bezier(.4,0,.2,1);}
.fn-debt-meta{display:flex;justify-content:space-between;font-size:10px;color:var(--t3);}
/* Chart */
.fn-chart{margin:0 16px 14px;background:rgba(10,14,30,.7);border:1px solid var(--border);border-radius:18px;padding:14px;}
.fn-chart-hdr{font-size:9px;font-weight:700;letter-spacing:1.8px;color:var(--t3);text-transform:uppercase;margin-bottom:10px;}
.fn-chart-svg{display:block;}
/* Entry list */
.fn-sec-hdr{padding:10px 20px 6px;font-size:9px;font-weight:700;letter-spacing:1.8px;color:var(--t3);text-transform:uppercase;display:flex;align-items:center;gap:8px;}
.fn-sec-hdr::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.05);}
.fn-entry{margin:0 16px 8px;background:rgba(10,14,30,.8);border:1px solid var(--border);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px;position:relative;}
.fn-entry-ico{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.fn-entry-ico.inc{background:rgba(0,229,160,.1);}
.fn-entry-ico.exp{background:rgba(255,77,109,.1);}
.fn-entry-info{flex:1;}
.fn-entry-cat{font-size:12px;font-weight:700;}
.fn-entry-date{font-size:10px;color:var(--t3);margin-top:2px;}
.fn-entry-amt{font-size:15px;font-weight:800;flex-shrink:0;}
.fn-entry-amt.inc{color:var(--green);}
.fn-entry-amt.exp{color:var(--red);}
.fn-entry-actions{display:flex;gap:6px;flex-shrink:0;opacity:0;transition:opacity 200ms;}
.fn-entry:hover .fn-entry-actions{opacity:1;}
.fn-action-btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all 150ms;color:var(--t2);}
.fn-action-btn:active{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2);}
.fn-empty{text-align:center;padding:30px 20px;font-size:12px;color:var(--t3);line-height:1.7;}
/* Add button */
.fn-add-btn{
  display:block;width:calc(100% - 32px);margin:8px 16px 20px;
  padding:15px;border:none;border-radius:18px;
  background:linear-gradient(135deg,var(--blue2),var(--purple2));
  color:#fff;font-size:14px;font-weight:700;cursor:pointer;letter-spacing:.3px;
  box-shadow:0 4px 24px rgba(26,95,255,.35),0 0 0 1px rgba(79,195,247,.15);
  transition:transform .1s,opacity .15s;
}
.fn-add-btn:active{transform:scale(.99);opacity:.9;}
/* Bottom sheet */
.fn-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;display:none;
  align-items:flex-end;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
.fn-overlay.open{display:flex;}
.fn-sheet{
  width:100%;background:#0c0f1e;border-radius:28px 28px 0 0;
  border:1px solid rgba(255,255,255,.08);border-bottom:none;
  padding:16px 20px calc(28px + env(safe-area-inset-bottom));
  box-shadow:0 -8px 40px rgba(0,0,0,.8);
  animation:sheet-up .28s cubic-bezier(.32,1.2,.5,1);
  max-height:88vh;overflow-y:auto;
}
@keyframes sheet-up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.fn-handle{width:40px;height:4px;background:rgba(255,255,255,.15);border-radius:4px;margin:0 auto 18px;}
.fn-sh-title{font-size:18px;font-weight:800;margin-bottom:16px;}
.fn-type-row{display:flex;gap:8px;margin-bottom:16px;}
.fn-tbtn{flex:1;padding:10px;border-radius:14px;font-size:13px;font-weight:700;cursor:pointer;border:1.5px solid rgba(255,255,255,.1);background:transparent;color:var(--t3);transition:all .15s;}
.fn-tbtn.fn-inc.active{background:rgba(0,229,160,.12);border-color:rgba(0,229,160,.35);color:var(--green);}
.fn-tbtn.fn-exp.active{background:rgba(255,77,109,.12);border-color:rgba(255,77,109,.35);color:var(--red);}
.fn-cats{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px;}
.fn-cat{padding:7px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:var(--t2);transition:all .15s;}
.fn-cat.active{background:rgba(79,195,247,.15);border-color:rgba(79,195,247,.35);color:var(--blue);}
.fn-amt-row{display:flex;gap:8px;margin-bottom:12px;align-items:center;}
.fn-ai{flex:1;background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.1);border-radius:14px;padding:13px 14px;color:var(--text);font-size:22px;font-weight:700;outline:none;transition:border-color .2s;}
.fn-ai:focus{border-color:rgba(79,195,247,.4);}
.fn-au{font-size:14px;color:var(--t3);font-weight:700;flex-shrink:0;}
.fn-usd-blk{margin-bottom:12px;}
.fn-rate-row{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.04);border-radius:12px;padding:10px 12px;margin-bottom:8px;}

function miniRing(pct,size=44,sw=4){
  const r=(size-sw)/2,c=2*Math.PI*r,off=c*(1-pct/100);
  return`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg);flex-shrink:0">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="${sw}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(180,92,255,0.7)" stroke-width="${sw}"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round"
      style="filter:drop-shadow(0 0 4px rgba(180,92,255,0.6))"/>
  </svg>`;
}

const HABITS=[
  {id:'workout',name:'Тренировка',icon:'🏋',color:'bl',freq:'Пн · Ср · Пт'},
  {id:'content',name:'Контент',icon:'📝',color:'gr',freq:'Рабочие дни'},
  {id:'nosmoke',name:'Не курил',icon:'🚭',color:'pu',freq:'Каждый день'},
];
function dateKeyOf(d){
  return`${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getFullYear()).slice(2)}`;
}
function getLast7Days(){
  const abbr=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'],days=[];
  for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push({key:dateKeyOf(d),abbr:abbr[d.getDay()],isToday:i===0});}
  return days;
}
function getHabitStreak(id){
  const h=state.habits||{};let n=0;const d=new Date();
  while(n<365){if(!h[id+'_'+dateKeyOf(d)])break;n++;d.setDate(d.getDate()-1);}
  return n;
}
function getTotalStreak(){
  const h=state.habits||{};let n=0;const d=new Date();
  while(n<365){
    const k=dateKeyOf(d);
    if(!HABITS.some(b=>h[b.id+'_'+k]))break;
    n++;d.setDate(d.getDate()-1);
  }
  return n;
}
function getConsistency(){
  const h=state.habits||{};
  const start=new Date('2026-05-21'),today=new Date();
  let total=0,done=0;const d=new Date(start);
  while(d<=today){total++;const k=dateKeyOf(d);if(HABITS.some(b=>h[b.id+'_'+k]))done++;d.setDate(d.getDate()+1);}
  return total>0?Math.round(done/total*100):0;
}
function getTodayDone(){
  const h=state.habits||{},k=todayKey();
  return HABITS.filter(b=>h[b.id+'_'+k]).length;
}
function pluralDays(n){
  if(n%10===1&&n%100!==11)return'день подряд';
  if([2,3,4].includes(n%10)&&![12,13,14].includes(n%100))return'дня подряд';
  return'дней подряд';
}
function renderHabits(){
  if(!state.habits)state.habits={};
  const h=state.habits,tk=todayKey(),L7=getLast7Days();
  const streak=getTotalStreak(),cons=getConsistency(),td=getTodayDone();
  const ringPct=Math.round(td/HABITS.length*100);
  const ringOff=Math.round(251*(1-ringPct/100)*10)/10;
  let html=`<div class="hb-hero">
    <div class="hb-hero-bloom"></div>
    <div class="hb-hero-dots"></div>
    <div class="hb-hero-top">
      <div class="hb-hero-left">
        <div class="hb-eyebrow">ЕЖЕДНЕВНЫЕ ПРИВЫЧКИ</div>
        <div class="hb-streak">🔥 <span class="hb-streak-num">${streak}</span> ${pluralDays(streak)}</div>
        <div class="hb-consistency">${cons}% постоянство</div>
        <div class="hb-done-count">${td} из ${HABITS.length} сегодня</div>
      </div>
      <div class="hb-ring-wrap">
        <svg class="hb-ring-svg" viewBox="0 0 100 100">
          <circle class="hb-ring-bg" cx="50" cy="50" r="40"/>
          <circle class="hb-ring-fg" cx="50" cy="50" r="40" style="stroke-dashoffset:${ringOff}"/>
        </svg>
        <div class="hb-ring-center">
          <div class="hb-ring-pct">${ringPct}%</div>
          <div class="hb-ring-lbl">сегодня</div>
        </div>
      </div>
    </div>
  </div>`;
  HABITS.forEach(hab=>{
    const stk=getHabitStreak(hab.id),isDone=!!h[hab.id+'_'+tk];
    const dots=L7.map(day=>{
      const done=!!h[hab.id+'_'+day.key];
      return`<div class="hb-day"><div class="hb-dot${done?' done':''}${day.isToday?' today':''}"></div><div class="hb-dlbl${day.isToday?' today':''}">${day.abbr}</div></div>`;
    }).join('');
    html+=`<div class="hb-card hb-${hab.color}">
      <div class="hb-top">
        <div class="hb-ico">${hab.icon}</div>
        <div class="hb-info"><div class="hb-name">${hab.name}</div><div class="hb-freq">${hab.freq}</div></div>
        <div class="hb-stk">${stk>0?'🔥'+stk:'—'}</div>
      </div>
      <div class="hb-week">${dots}</div>
      <button class="hb-btn ${isDone?'done':'idle'}" onclick="toggleHabit('${hab.id}')">
        ${isDone?'✓ Выполнено сегодня':'○ Отметить сегодня'}
      </button>
    </div>`;
  });
  html+=`<button class="hb-add">＋ Добавить привычку</button>`;
  const el=document.getElementById('habits-body');
  if(el)el.innerHTML=html;
}
function toggleHabit(id){

  document.getElementById('spanel-fit').innerHTML=`<div class="scard"><div class="scard-hdr">🏋 Тренировки · Пн/Ср/Пт</div>${WO.map(w=>`<div class="wcard"><div class="wday">${w.day}</div><div class="wtype">${w.type}</div><div class="wdesc">${w.desc}</div></div>`).join('')}</div><div class="scard"><div class="scard-hdr">🚬 Протокол отказа</div>${SMOKE.map(s=>`<div class="srow"><div class="speriod">${s.period}</div><div class="srule">${s.rule}</div></div>`).join('')}</div>`;
}
function switchSTab(n,el){
  document.querySelectorAll('.stab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('.spanel').forEach(p=>p.classList.remove('active'));

/* ── FINANCE ── */
const FN_DEBT=540000;
let fnForm={type:'income',cat:'',editIdx:null};
function initFn(){if(!state.finance)state.finance={entries:[],usdRate:90};}
function fmtRub(n){return Math.abs(Math.round(n)).toLocaleString('ru')+' ₽';}
function parseDK(k){const[d,m,y]=k.split('.');return new Date(`20${y}-${m}-${d}`);}

function renderFinance(){
  initFn();
  const{entries,usdRate}=state.finance;
  const totalInc=entries.filter(e=>e.type==='income').reduce((a,e)=>a+e.amt,0);
  const totalExp=entries.filter(e=>e.type==='expense').reduce((a,e)=>a+e.amt,0);
  const bal=totalInc-totalExp;
  const debtPaid=entries.filter(e=>e.type==='expense'&&['Кредит Сбер','Кредит Яндекс'].includes(e.cat)).reduce((a,e)=>a+e.amt,0);
  const debtRemain=Math.max(0,FN_DEBT-debtPaid);
  const debtPct=Math.min(100,Math.round(debtPaid/FN_DEBT*100));
  const balCls=bal>0?'pos':bal<0?'neg':'zero';

  let html=`<div class="fn-hero">
    <div class="fn-bloom"></div>
    <div style="position:relative;z-index:1">
      <div class="fn-eyebrow">БАЛАНС</div>
      <div class="fn-balance ${balCls}">${bal<0?'−':''}${fmtRub(bal)}</div>
      <div class="fn-row2">
        <div class="fn-c2"><div class="fn-c2-lbl inc">▲ ДОХОДЫ</div><div class="fn-c2-val inc">${fmtRub(totalInc)}</div></div>
        <div class="fn-c2"><div class="fn-c2-lbl exp">▼ РАСХОДЫ</div><div class="fn-c2-val exp">${fmtRub(totalExp)}</div></div>
      </div>
    </div>
  </div>
  <div class="fn-debt-card">
    <div class="fn-debt-top">
      <div><div class="fn-debt-label">До закрытия долгов</div><div class="fn-debt-sub">Сбер 200 000 + Яндекс 340 000 ₽</div></div>
      <div class="fn-debt-remain">${fmtRub(debtRemain)}</div>
    </div>
    <div class="fn-debt-bar"><div class="fn-debt-fill" style="width:${debtPct}%"></div></div>
    <div class="fn-debt-meta"><span>Внесено ${fmtRub(debtPaid)}</span><span>${debtPct}% погашено</span></div>
  </div>`;

  html+=fnChart(entries);

  const incE=[...entries].filter(e=>e.type==='income').reverse();
  const expE=[...entries].filter(e=>e.type==='expense').reverse();
  if(incE.length){
    html+=`<div class="fn-sec-hdr">Доходы</div>`;
    incE.forEach(e=>{const idx=entries.indexOf(e);html+=`<div class="fn-entry"><div class="fn-entry-ico inc">${fnIco(e.cat)}</div><div class="fn-entry-info"><div class="fn-entry-cat">${e.cat}</div><div class="fn-entry-date">${e.date}${e.amtUsd?' · $'+e.amtUsd:''}</div></div><div class="fn-entry-amt inc">+${fmtRub(e.amt)}</div><div class="fn-entry-actions"><button class="fn-action-btn" onclick="editFnEntry(${idx})">✏️</button><button class="fn-action-btn" onclick="deleteFnEntry(${idx})">🗑️</button></div></div>`;});
  }
  if(expE.length){
    html+=`<div class="fn-sec-hdr">Расходы</div>`;
    expE.forEach(e=>{const idx=entries.indexOf(e);html+=`<div class="fn-entry"><div class="fn-entry-ico exp">${fnIco(e.cat)}</div><div class="fn-entry-info"><div class="fn-entry-cat">${e.cat}</div><div class="fn-entry-date">${e.date}</div></div><div class="fn-entry-amt exp">−${fmtRub(e.amt)}</div><div class="fn-entry-actions"><button class="fn-action-btn" onclick="editFnEntry(${idx})">✏️</button><button class="fn-action-btn" onclick="deleteFnEntry(${idx})">🗑️</button></div></div>`;});
  }
  if(!entries.length)html+=`<div class="fn-empty">Пока нет записей 💸<br>Нажми кнопку ниже чтобы начать</div>`;
  html+=`<button class="fn-add-btn" onclick="openFnSheet()">＋ Добавить запись</button>`;

  const el=document.getElementById('finance-body');
  if(el)el.innerHTML=html;
}

function fnChart(entries){
  if(entries.length<2)return'';
  const W=300,H=56,P=4;
  const map={};
  entries.forEach(e=>{if(!map[e.date])map[e.date]=0;map[e.date]+=e.type==='income'?e.amt:-e.amt;});
  const dates=Object.keys(map).sort((a,b)=>parseDK(a)-parseDK(b));
  if(dates.length<2)return'';
  const pts=[];let run=0;
  dates.forEach(d=>{run+=map[d];pts.push(run);});
  const mn=Math.min(0,...pts),mx=Math.max(...pts,1),rng=mx-mn||1;
  const pp=pts.map((v,i)=>{
    const x=P+(i/(pts.length-1))*(W-2*P);
    const y=P+(1-(v-mn)/rng)*(H-2*P);
    return x.toFixed(1)+','+y.toFixed(1);
  }).join(' ');
  const zY=(P+(1-(0-mn)/rng)*(H-2*P)).toFixed(1);
  const fill=P+','+zY+' '+pp+' '+(W-P)+','+zY;
  return`<div class="fn-chart"><div class="fn-chart-hdr">Динамика баланса</div>
  <svg width="100%" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" class="fn-chart-svg">
    <defs><linearGradient id="fcg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="rgba(0,229,160,.28)"/><stop offset="100%" stop-color="rgba(0,229,160,0)"/></linearGradient></defs>
    <polygon points="${fill}" fill="url(#fcg)"/>
    <polyline points="${pp}" fill="none" stroke="#00e5a0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="filter:drop-shadow(0 0 4px rgba(0,229,160,.6))"/>
  </svg></div>`;
}

function fnIco(cat){
  return{'Bybit рефералки':'₿','Смена Озон':'📦','Другое':'💰','Кредит Сбер':'🏦','Кредит Яндекс':'🏦','Продукты':'🛒','Дети':'👶'}[cat]||'💸';
}

function openFnSheet(){
  initFn();
  fnForm={type:'income',cat:'',editIdx:null};
  document.getElementById('fn-overlay').classList.add('open');
  document.getElementById('fn-t-inc').classList.add('active');
  document.getElementById('fn-t-exp').classList.remove('active');
  document.getElementById('fn-amt').value='';
  const ua=document.getElementById('fn-usd-amt');if(ua)ua.value='';
  const pr=document.getElementById('fn-rub-preview');if(pr)pr.textContent='0 ₽';
  document.getElementById('fn-usd-row').style.display='none';
  document.getElementById('fn-rub-row').style.display='flex';
  document.getElementById('fn-quick').style.display='none';
  document.getElementById('fn-rate').value=state.finance.usdRate||90;
  document.getElementById('fn-sh-title').textContent='Добавить запись';
  const sb=document.querySelector('.fn-sb');if(sb)sb.textContent='Сохранить';
  fnRenderCats();
  if(tg)tg.HapticFeedback?.impactOccurred('light');
}

function editFnEntry(idx){
  initFn();
  const e=state.finance.entries[idx];
  if(!e)return;
  fnForm={type:e.type,cat:e.cat,editIdx:idx};
  document.getElementById('fn-overlay').classList.add('open');
  document.getElementById('fn-t-inc').classList.toggle('active',e.type==='income');
  document.getElementById('fn-t-exp').classList.toggle('active',e.type==='expense');
  const isUsd=e.cat==='Bybit рефералки';
  if(isUsd){
    const ua=document.getElementById('fn-usd-amt');if(ua)ua.value=e.amtUsd||'';
    document.getElementById('fn-usd-row').style.display='block';
    document.getElementById('fn-rub-row').style.display='none';
    const p=document.getElementById('fn-rub-preview');if(p)p.textContent=e.amt+' ₽';
  }else{
    const am=document.getElementById('fn-amt');if(am)am.value=e.amt;
    document.getElementById('fn-usd-row').style.display='none';
    document.getElementById('fn-rub-row').style.display='flex';
  }
  document.getElementById('fn-rate').value=state.finance.usdRate||90;
  document.getElementById('fn-sh-title').textContent='Редактировать запись';
  const sb=document.querySelector('.fn-sb');if(sb)sb.textContent='Обновить';
  fnRenderCats();
  if(tg)tg.HapticFeedback?.impactOccurred('light');
}

function deleteFnEntry(idx){
  if(confirm('Удалить эту запись?')){
    state.finance.entries.splice(idx,1);
    saveState();renderFinance();
    if(tg)tg.HapticFeedback?.notificationOccurred('success');
  }
}
function closeFnSheet(ev){
  if(ev.target===document.getElementById('fn-overlay'))
    document.getElementById('fn-overlay').classList.remove('open');
}
function setFnType(t){
  fnForm.type=t;fnForm.cat='';
  document.getElementById('fn-t-inc').classList.toggle('active',t==='income');
  document.getElementById('fn-t-exp').classList.toggle('active',t==='expense');
  document.getElementById('fn-usd-row').style.display='none';
  document.getElementById('fn-rub-row').style.display='flex';
  document.getElementById('fn-quick').style.display='none';
  fnRenderCats();
}
function fnRenderCats(){
  const inc=['Bybit рефералки','Смена Озон','Другое'];
  const exp=['Кредит Сбер','Кредит Яндекс','Продукты','Дети','Другое'];
  const cats=fnForm.type==='income'?inc:exp;
  const el=document.getElementById('fn-cats');
  if(el)el.innerHTML=cats.map(c=>`<button class="fn-cat${fnForm.cat===c?' active':''}" onclick="selectFnCat('${c}')">${c}</button>`).join('');
}
function selectFnCat(cat){
  fnForm.cat=cat;fnRenderCats();
  const isUsd=cat==='Bybit рефералки';
  document.getElementById('fn-usd-row').style.display=isUsd?'block':'none';
  document.getElementById('fn-rub-row').style.display=isUsd?'none':'flex';
  const q=document.getElementById('fn-quick');
  if(cat==='Кредит Сбер'){q.style.display='flex';q.innerHTML=`<button class="fn-qbtn" onclick="setFnAmt(10000)">10 000 ₽</button>`;}
  else if(cat==='Кредит Яндекс'){q.style.display='flex';q.innerHTML=`<button class="fn-qbtn" onclick="setFnAmt(21000)">21 000 ₽</button>`;}
  else{q.style.display='none';q.innerHTML='';}
  if(tg)tg.HapticFeedback?.impactOccurred('light');
}
function setFnAmt(v){const i=document.getElementById('fn-amt');if(i)i.value=v;}
function onFnRateInput(){
  const rate=parseFloat(document.getElementById('fn-rate')?.value)||90;
  const usd=parseFloat(document.getElementById('fn-usd-amt')?.value)||0;
  const p=document.getElementById('fn-rub-preview');if(p)p.textContent=Math.round(usd*rate).toLocaleString('ru')+' ₽';
  state.finance.usdRate=rate;
}
function onFnUsdInput(){
  const rate=parseFloat(document.getElementById('fn-rate')?.value)||90;
  const usd=parseFloat(document.getElementById('fn-usd-amt')?.value)||0;
  const p=document.getElementById('fn-rub-preview');if(p)p.textContent=Math.round(usd*rate).toLocaleString('ru')+' ₽';
}
function saveFnEntry(){
  initFn();
  if(!fnForm.cat){if(tg)tg.HapticFeedback?.notificationOccurred('error');return;}
  let amt=0,amtUsd=null;
  if(fnForm.cat==='Bybit рефералки'){
    const usd=parseFloat(document.getElementById('fn-usd-amt')?.value)||0;
    const rate=parseFloat(document.getElementById('fn-rate')?.value)||90;
    if(!usd){if(tg)tg.HapticFeedback?.notificationOccurred('error');return;}
    amt=Math.round(usd*rate);amtUsd=usd;
    state.finance.usdRate=rate;
  }else{
    amt=parseInt(document.getElementById('fn-amt')?.value)||0;
    if(!amt){if(tg)tg.HapticFeedback?.notificationOccurred('error');return;}
  }
  if(fnForm.editIdx!==null&&fnForm.editIdx!==undefined){
    const e=state.finance.entries[fnForm.editIdx];
    e.type=fnForm.type;e.cat=fnForm.cat;e.amt=amt;
    if(amtUsd!==null)e.amtUsd=amtUsd;else delete e.amtUsd;
  }else{
    const entry={id:Date.now().toString(),type:fnForm.type,cat:fnForm.cat,amt,date:todayKey()};
    if(amtUsd!==null)entry.amtUsd=amtUsd;
    state.finance.entries.push(entry);
  }
  saveState();
  document.getElementById('fn-overlay').classList.remove('open');
  renderFinance();
  if(tg)tg.HapticFeedback?.notificationOccurred('success');
}

function switchScreen(name,btn){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  if(btn&&btn.classList&&btn.classList.contains('nb'))btn.classList.add('active');
  window.scrollTo(0,0);
}

function render(){
  try{renderDash();renderHabits();renderSchedule();renderFinance();}
  catch(e){console.error('render:',e);}
}
loadState();
